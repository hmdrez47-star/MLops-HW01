# =============================================================================
# MLOps Homework 01 - single source of truth for every run parameter.
# Nothing that a run may need to change is hard-coded in the source modules.
# =============================================================================

project:
  name: "mlops_homework_01"
  seed: 42

data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  # Reference training data (400 rows).
  dataset_file: "dataset_v1.csv"
  dataset_version: "v1"
  # Second data version with drift (480 rows) - never used for training by
  # default, only for drift / robustness evaluation.
  drift_dataset_file: "dataset_v2.csv"
  drift_dataset_version: "v2"
  target_column: "churn"
  test_size: 0.2
  random_state: 42
  stratify: true
  versions_dir: "data_versions"

features:
  scaling: "standard"          # "standard" | "minmax" | "none"
  feature_selection_k: 10      # out of 12 raw features
  feature_selection_score_func: "f_classif"

model:
  # Reference run. Only ~26% of the customers churn, so every model below is
  # configured with class_weight="balanced": without it the tree model simply
  # predicts the majority class and F1 collapses to ~0.08.
  type: "logistic_regression"  # "random_forest" | "logistic_regression" | "svm"
  params:
    C: 1.0
    max_iter: 2000
    class_weight: "balanced"
    random_state: 42
  # random_forest preset:
  #   n_estimators: 300
  #   max_depth: 6
  #   min_samples_leaf: 2
  #   class_weight: "balanced"
  #   random_state: 42
  #   n_jobs: -1
  # svm preset:
  #   C: 1.0
  #   kernel: "rbf"
  #   gamma: "scale"
  #   class_weight: "balanced"
  #   probability: true
  #   random_state: 42
  output_dir: "models"

experiments:
  # A local sqlite backend keeps the tracking server optional and the project
  # fully reproducible offline. Point this at http://localhost:5000 to use a
  # real MLflow server instead.
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "mlops_homework_01"
  results_dir: "experiments/results"

monitoring:
  drift_threshold: 0.3           # alert when drift_score > 0.3
  ks_p_value_threshold: 0.05     # alpha of the KS test
  mean_shift_threshold: 0.1      # 10% relative change of the mean
  log_path: "experiments/logs"
  reports_path: "reports"

serving:
  host: "0.0.0.0"
  port: 8000
  model_dir: "models"
