name: mlops-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # 1) Code quality gate
  # ---------------------------------------------------------------------
  code-quality:
    name: Code quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint tooling
        run: pip install ruff==0.17.4
      - name: Ruff lint
        run: ruff check src experiments scripts tests
      - name: Ruff format check
        run: ruff format --check src experiments scripts tests

  # ---------------------------------------------------------------------
  # 2) Test gate
  # ---------------------------------------------------------------------
  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------
  # 3) Training: reproduce the pipeline + MLflow runs
  # ---------------------------------------------------------------------
  train:
    name: Train + track experiments
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tracked experiments
        run: python experiments/run_experiments.py
      - name: Show experiment comparison
        run: cat experiments/results/comparison.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-experiments
          path: |
            models/
            experiments/results/
            data_versions/metadata.json
            mlflow.db

  # ---------------------------------------------------------------------
  # 4) Data drift gate (model health signal)
  # ---------------------------------------------------------------------
  drift-check:
    name: Data drift report
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate drift report
        run: python scripts/drift_report.py --fail-on-drift
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/

  # ---------------------------------------------------------------------
  # 5) Build + post-deployment smoke test of the container
  # ---------------------------------------------------------------------
  docker-smoke:
    name: Docker build + post-deploy health check
    runs-on: ubuntu-latest
    needs: [train, drift-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pipeline dependencies (to produce the model)
        run: pip install -r requirements.txt
      - name: Train the artifact that gets baked into the image
        run: python experiments/train_experiment.py --model-type random_forest --scaling none
      - name: Build image
        run: docker build -t mlops-serving:${{ github.sha }} .
      - name: Run container
        run: docker run -d --name serving -p 8000:8000 mlops-serving:${{ github.sha }}
      - name: Wait for the container
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs serving
          exit 1
      - name: Post-deployment contract check
        run: python scripts/healthcheck.py --base-url http://127.0.0.1:8000
      - name: Container logs
        if: always()
        run: docker logs serving
